name: Gegevens en dashboard controleren

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/validate-snapshot.mjs
      - run: node --test data/bronnen/*.test.mjs
