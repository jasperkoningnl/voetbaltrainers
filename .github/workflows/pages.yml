# Publiceert de site met GitHub als enige bron voor clubs, trainers en seizoenen.
# Ook handmatig publiceren leest nooit Firestore en past geen oude imports opnieuw toe.
# Vereist: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Site publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publiceerbare gegevens controleren
        run: node .github/scripts/validate-snapshot.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v5
