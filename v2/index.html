<!DOCTYPE html>
<!-- v2 is de hoofdversie geworden. Oude links naar v2/ (ook #explore/...) sturen door. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Managerial Merry-Go-Round</title>
    <meta name="robots" content="noindex">
    <script>
        const h = location.hash.replace(/^#explore\/?/, "#");
        location.replace(location.hash.startsWith("#explore") ? `../explore.html${h === "#" ? "" : h}` : "../index.html");
    </script>
    <meta http-equiv="refresh" content="0; url=../index.html">
</head>
<body><p><a href="../index.html">The Managerial Merry-Go-Round</a></p></body>
</html>
